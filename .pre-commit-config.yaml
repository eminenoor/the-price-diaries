# Runs before every commit, and checks each commit message, once enabled:
#   uvx pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=800]
      - id: detect-private-key

  - repo: local
    hooks:
      # The project's own Ruff (uv.lock), so the hook and CI never disagree.
      - id: ruff
        name: ruff check
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      # One line of at most 60 characters: "type(scope): what changed", starting lowercase.
      - id: commit-message
        name: commit message
        language: pygrep
        entry: '\A(?=[^\n]{1,60}(\n|\Z))(feat|fix|refactor|test|docs|style|chore|build|ci)(\((api|parsers|fetcher|analysis|db|ui|cli|demo|deps)\))?: [a-z0-9]'
        args: [--multiline, --negate]
        stages: [commit-msg]
