<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal price diary for skincare and beauty products." />
    <title>The Price Diaries</title>
    <script>
      // Set night/quiet before the first paint, so quiet mode doesn't flash dark.
      try {
        if (localStorage.getItem("price-diaries:mode") === "quiet")
          document.documentElement.dataset.mode = "quiet";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
