# Used for creating new migrations: uv run alembic revision --autogenerate -m "..."
# The app itself runs migrations from code (price_diaries/migrate.py).
[alembic]
script_location = src/price_diaries/migrations
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is read from PD_DATABASE_URL (see settings.py)

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
