[project]
name = "price-diaries"
version = "0.1.0"
description = "Local price tracker for online stores, with fake-discount detection."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emine Noor" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10,<4",
    "desktop-notifier>=6",
    # Real browser for stores that render prices with JavaScript.
    # After installing: `uv run playwright install chromium`
    "playwright>=1.47",
]

[project.scripts]
price-diaries = "price_diaries.cli:main"

[dependency-groups]
dev = [
    # Starlette's TestClient (used by the API tests) prefers it over httpx.
    "httpx2>=2.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_diaries"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"src/price_diaries/demo.py" = ["S311"]  # non-crypto random is fine for demo data
"tests/test_timing.py" = ["S311"]  # and for prices that move at random
